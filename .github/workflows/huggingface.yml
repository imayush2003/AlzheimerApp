name: Sync to Hugging Face hub

on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Strip the GitHub git history which might contain non-LFS heavy blobs
          # This prevents Hugging Face from rejecting the push
          rm -rf .git
          git config --global user.email "deploy@example.com"
          git config --global user.name "Deploy Bot"
          git init -b main
          git lfs install
          # Explicitly track model weights
          git lfs track "*.h5"
          git lfs track "*.tflite"
          git add .gitattributes
          git add .
          git commit -m "Automated Deploy to Hugging Face Spaces"
          git push --force https://imAyush1164:$HF_TOKEN@huggingface.co/spaces/imAyush1164/AlzheimerApp main
