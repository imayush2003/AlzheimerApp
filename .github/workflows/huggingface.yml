name: Sync to Hugging Face hub

on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # NOTE: Make sure your Hugging Face username and Space name match the URL below!
        # If your HF username is not 'imAyush1164' or your space is not 'AlzheimerApp', 
        # please update this URL.
        run: |
          rm -rf .git
          git config --global user.email "bot@example.com"
          git config --global user.name "Deploy Bot"
          git init
          git lfs install
          git lfs track "*.h5"
          git add .gitattributes
          git add .
          git commit -m "Deploy to Hugging Face Spaces"
          git push --force https://imAyush1164:$HF_TOKEN@huggingface.co/spaces/imAyush1164/AlzheimerApp master:main
